; =============================================================================
;  PROFILES.INI  —  one file, one section per emulator+system combination
; =============================================================================
;  This is a plain Windows-style INI file:
;     [SectionName]
;     Key=Value
;
;  Both master scripts read from THIS SAME FILE:
;     - bezel_launcher.cmd  reads: EmulatorExe, EmulatorArgs, EmulatorPathVar,
;                                  PauseTime
;     - bezel_display.ahk   reads: BezelFolder, CloseOnEscape, CloseProcess,
;                                  DefaultBezel, IsTRS80, PauseTime, ProcessName
;
;  To add a new emulator+system combo, copy the [TEMPLATE] section below, rename
;   it tosomething meaningful (that name becomes your "ProfileName"), and fill in
;  the values. No script code needs to change.
; =============================================================================

; -----------------------------------------------------------------------
; [Settings] — global values shared by every profile.
; -----------------------------------------------------------------------
[Settings]
; Root folder of your RetroArch install. This is used purely as a
; ready-made, organized library of bezel PNGs — no RetroArch process is
; ever launched. Bezel images are expected at:
;     %RAHomeDir%\overlays\GameBezels\<BezelFolder>\<RomFileName>.png
; and the per-system default/fallback image at:
;     %RAHomeDir%\overlays\<DefaultBezel>
RAHomeDir=D:\RetroArch_1.22.2

; -----------------------------------------------------------------------
; [TEMPLATE] — copy/paste this, rename the section, fill in your values.
; -----------------------------------------------------------------------
;[emulatorName_systemName]
;BezelFolder=ExampleSystemFolder
;CloseOnEscape=0
;CloseProcess=exampleEmulator.exe
;DefaultBezel=Example-Default-Bezel.png
;EmulatorArgs=
;EmulatorExe=exampleEmulator.exe
;EmulatorPathVar=exampleEmulator_path
;IsTRS80=0
;PauseTime=5000
;ProcessName=ahk_exe exampleEmulator.exe

